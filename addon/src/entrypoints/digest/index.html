<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digest des newsletters</title>
    <style>
      :root { font-family: system-ui, -apple-system, sans-serif; }
      body { margin: 0; background: #faf9f5; color: #1a1a18; }
      header {
        display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        padding: 14px 18px; border-bottom: 1px solid #e5e3da; background: #fff;
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0 auto 0 0; }
      select, button, a.dl {
        font: inherit; padding: 7px 12px; border-radius: 8px;
        border: 1px solid #cfcdc4; background: #fff; cursor: pointer;
      }
      button.primary { background: #1f6e56; color: #fff; border-color: #1f6e56; }
      button:disabled { opacity: .55; cursor: default; }
      a.dl { text-decoration: none; color: #1a1a18; }
      #status { padding: 8px 18px; font-size: 13px; color: #5f5e5a; }
      iframe { width: 100%; height: calc(100vh - 112px); border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <header>
      <h1>Digest des newsletters</h1>
      <select id="provider">
        <option value="gmail">Gmail</option>
        <option value="outlook">Outlook / Microsoft 365</option>
      </select>
      <button id="run" class="primary">Générer</button>
      <a id="download" class="dl" download="digest.pdf" style="display:none">Télécharger</a>
    </header>
    <div id="status">Choisis un compte puis clique sur « Générer ».</div>
    <iframe id="viewer" title="Aperçu PDF"></iframe>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
